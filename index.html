<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus certificados</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="titulo">Meus certificados</h1>
  <button id="voltar" type="button" hidden>← Todos os certificados</button>
</header>
<main>
  <div id="grade" class="grade"></div>
  <p id="msg" class="msg"></p>
</main>

<div id="visor" hidden role="dialog" aria-modal="true" aria-label="Visualizar certificado">
  <div class="barra">
    <strong id="v-titulo"></strong>
    <a id="v-baixar" download>Baixar</a>
    <button id="v-fechar" type="button" aria-label="Fechar">✕</button>
  </div>
  <div class="palco">
    <button id="v-ant" class="nav" type="button" aria-label="Anterior">‹</button>
    <div id="v-doc" class="doc"></div>
    <button id="v-prox" class="nav" type="button" aria-label="Próximo">›</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
